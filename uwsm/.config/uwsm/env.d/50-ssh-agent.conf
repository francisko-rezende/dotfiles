# Point every process in the session at the systemd-managed ssh-agent
# (ssh-agent.socket, from the openssh package). Not done via environment.d:
# that generator never expands unit-file specifiers like %t, and while it
# does expand $XDG_RUNTIME_DIR, only if that var already exists in the
# manager's environment when the generator runs — an implicit dependency on
# PAM ordering. This uwsm env.d (Omarchy's own preferred override point, see
# /usr/share/uwsm/env.d/10-omarchy) sets XDG_RUNTIME_DIR itself with a
# fallback before sourcing anything, so it doesn't need that assumption.
export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/ssh-agent.socket"
